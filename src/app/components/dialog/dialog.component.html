<!-- Dialog -->
<div #dialogRef class="modal" role="dialog" tabindex="-1">
  <div class="modal-dialog" role="document">
    <!-- Content -->
    <div class="modal-content">
      <!-- Header -->
      <div class="modal-header">
        <h5>
          <ng-content select="dialog-heading" />
        </h5>

        <button
          type="button"
          class="btn-close"
          data-dismiss="modal"
          aria-label="Close"
          (click)="close()"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <ng-content />
      </div>

      <!-- Actions -->
      <div class="modal-footer">
        <ng-content select="dialog-actions">
          <button class="btn btn-primary" (click)="dialogEl().close()">
            Close
          </button>
        </ng-content>
      </div>
    </div>
  </div>
</div>
